name: Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.FISCALE_KEYSTORE_B64 }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK debug (instala direto no Android)
        run: ./gradlew --no-daemon assembleDebug

      - name: Compilar APK release assinado (se houver keystore nos secrets)
        if: env.KEYSTORE_B64 != ''
        env:
          FISCALE_KEYSTORE_SENHA: ${{ secrets.FISCALE_KEYSTORE_SENHA }}
          FISCALE_KEY_ALIAS: ${{ secrets.FISCALE_KEY_ALIAS }}
          FISCALE_KEY_SENHA: ${{ secrets.FISCALE_KEY_SENHA }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fiscale.jks"
          FISCALE_KEYSTORE="$RUNNER_TEMP/fiscale.jks" ./gradlew --no-daemon assembleRelease

      - name: Renomear
        run: |
          mkdir -p saida
          cp app/build/outputs/apk/debug/app-debug.apk saida/FISCALE-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk saida/FISCALE.apk
          fi
          ls -la saida

      - uses: actions/upload-artifact@v4
        with:
          name: FISCALE-android
          path: android/saida/*.apk

      - name: Anexar ao release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" saida/*.apk --clobber
